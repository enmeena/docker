name: Build and Push Docker Image

on:
  workflow_dispatch: # This lets you run it manually with a button

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dockerfile
        run: |
          echo "FROM alpine" > Dockerfile
          echo "CMD ['echo', 'Image for 25ds2000013']" >> Dockerfile

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace YOUR_REPO_NAME with your desired repo name
          tags: ${{ secrets.DOCKER_USERNAME }}/enmeena:25ds2000013
